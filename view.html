<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }

#header {
  background: #1a2744;
  color: white;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
#header h1 { font-size: 15px; font-weight: 600; flex: 1; min-width: 200px; }
#header .subtitle { font-size: 11px; color: #a7f3d0; font-weight: 600; width: 100%; }
#search-box {
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  width: 220px;
  outline: none;
}
#count-badge {
  background: #16a34a;
  color: white;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

#controls {
  background: #f1f5f9;
  padding: 6px 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  border-bottom: 1px solid #e2e8f0;
}
.ctrl-label { font-size: 11px; color: #64748b; font-weight: 700; white-space: nowrap; }
.ctrl-sep { width: 1px; background: #cbd5e1; height: 20px; margin: 0 4px; }

/* Legend strip */
#legend-strip {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #fff;
  padding: 4px 16px;
  border-bottom: 1px solid #e2e8f0;
  font-size: 11px;
  color: #334155;
  flex-wrap: wrap;
}
.leg-item { display: flex; align-items: center; gap: 5px; }
.leg-pin {
  width: 14px; height: 20px;
  display: inline-flex; align-items: center; justify-content: center;
}
.leg-line {
  width: 28px; height: 4px;
  border-top: 3px dashed #555;
  position: relative;
}
.leg-line::before, .leg-line::after {
  content: '';
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: 7px; height: 7px;
  background: #555;
  border-radius: 50%;
  border: 1px solid white;
}
.leg-line::before { left: -3px; }
.leg-line::after  { right: -3px; }

.type-btn {
  padding: 4px 12px;
  border-radius: 20px;
  border: 2px solid;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.type-btn.active  { color: white; }
.type-btn.inactive { background: white !important; opacity: 0.5; }
#type-crossing { border-color: #1a2744; background: #1a2744; color: white; }
#type-sejajar  { border-color: #0891b2; background: #0891b2; color: white; }

.filter-btn {
  padding: 3px 9px;
  border-radius: 20px;
  border: 2px solid;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.filter-btn.active  { color: white; }
.filter-btn.inactive { background: white !important; opacity: 0.45; }

#btn-all {
  background: #334155; color: white;
  border: none; border-radius: 20px;
  padding: 4px 12px; font-size: 11px;
  font-weight: 700; cursor: pointer;
}

#map { flex: 1; }

/* Popup */
.custom-popup .leaflet-popup-content-wrapper {
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
  padding: 0; min-width: 270px;
}
.custom-popup .leaflet-popup-content { margin: 0; }
.popup-header {
  padding: 10px 14px 8px; color: white;
  border-radius: 8px 8px 0 0;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.popup-body { padding: 10px 14px 12px; font-size: 12px; }
.popup-row { display: flex; margin-bottom: 4px; }
.popup-label { color: #64748b; width: 130px; flex-shrink: 0; font-size: 11px; }
.popup-value { font-weight: 600; color: #1e293b; }
.popup-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 700; color: white;
  margin-left: auto;
}
.popup-final-note {
  margin-top: 10px; padding: 7px 9px; border-radius: 6px;
  background: #ecfdf5; border: 1px solid #a7f3d0;
  font-size: 10.5px; color: #047857; font-weight: 600;
}
.gmaps-btn {
  display: inline-block; margin-top: 8px;
  padding: 5px 12px; background: #10b981;
  color: white; text-decoration: none;
  border-radius: 5px; font-size: 11px; font-weight: 600;
}
.gmaps-btn:hover { background: #059669; }
</style>

function getColor(w) { return COLORS[w] || '#888'; }

// ── MAP ──
const map = L.map('map').setView([-6.9, 108.5], 7);
// Beberapa sumber tile OSM dicoba berurutan; kalau satu sumber banyak gagal (limit/down),
// otomatis pindah ke sumber berikutnya tanpa perlu edit ulang file ini.
const TILE_PROVIDERS = [
  { url: 'https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png', attribution: '&copy; OpenStreetMap contributors, Style: Wikimedia' },
  { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attribution: '&copy; OpenStreetMap contributors' },
  { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attribution: 'Tiles &copy; Esri' }
];
let _tileLayer = null, _tileErrCount = 0;
function loadTileProvider(idx) {
  if (_tileLayer) map.removeLayer(_tileLayer);
  const p = TILE_PROVIDERS[idx];
  _tileErrCount = 0;
  _tileLayer = L.tileLayer(p.url, { attribution: p.attribution, maxZoom: 19 });
  _tileLayer.on('tileerror', () => {
    _tileErrCount++;
    if (_tileErrCount > 8 && idx < TILE_PROVIDERS.length - 1) loadTileProvider(idx + 1);
  });
  _tileLayer.addTo(map);
}
loadTileProvider(0);

const wilayahList = [...new Set([
  ...CROSSING_DATA.map(d => d.wilayah),
  ...SEJAJAR_DATA.map(d => d.wilayah)
])].sort();

const activeWilayah = {};
wilayahList.forEach(w => activeWilayah[w] = true);
let showCrossing = true, showSejajar = true;

// ── CROSSING ICON: teardrop pin sederhana, tanpa badge status (semua titik sudah final) ──
function makeCrossingIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 36" width="22" height="30">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 8.4 12 24 12 24S24 20.4 24 12C24 5.4 18.6 0 12 0z"
          fill="${color}" stroke="white" stroke-width="1.8"/>
    <line x1="12" y1="6.5" x2="12" y2="17.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6.5" y1="12" x2="17.5" y2="12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </svg>`;
  return L.divIcon({ html: svg, className:'', iconSize:[22,30], iconAnchor:[10,30], popupAnchor:[0,-30] });
}

// ── POPUP ──
function buildPopup(d, tipe) {
  const color = getColor(d.wilayah);
  const badgeIcon = tipe === 'crossing' ? '⊕' : '〰';
  const badgeLabel = tipe === 'crossing' ? 'CROSSING' : 'SEJAJAR';
  const gmaps = tipe === 'crossing'
    ? `https://www.google.com/maps?q=${d.lat},${d.lon}`
    : `https://www.google.com/maps/dir/${d.lat1},${d.lon1}/${d.lat2},${d.lon2}`;
  const coordRow = tipe === 'crossing'
    ? `<div class="popup-row"><span class="popup-label">Koordinat</span><span class="popup-value">${d.lat}, ${d.lon}</span></div>`
    : `<div class="popup-row"><span class="popup-label">Koord. Awal</span><span class="popup-value">${d.lat1}, ${d.lon1}</span></div>
       <div class="popup-row"><span class="popup-label">Koord. Akhir</span><span class="popup-value">${d.lat2}, ${d.lon2}</span></div>`;

  return `<div>
    <div class="popup-header" style="background:${color}">
      <span>No ${d.no}${d.no_urut ? ' (urut '+d.no_urut+')' : ''} | ${d.wilayah}</span>
      <span class="popup-badge" style="background:rgba(0,0,0,0.25)">${badgeIcon} ${badgeLabel}</span>
    </div>
    <div class="popup-body">
      <div class="popup-row"><span class="popup-label">No BA</span><span class="popup-value">${d.no_ba}</span></div>
      <div class="popup-row"><span class="popup-label">KM+HM</span><span class="popup-value">${d.km}</span></div>
      <div class="popup-row"><span class="popup-label">Stasiun-Antara</span><span class="popup-value">${d.stasiun}</span></div>
      <div class="popup-row"><span class="popup-label">Lintas</span><span class="popup-value">${d.lintas}</span></div>
      <div class="popup-row"><span class="popup-label">Area</span><span class="popup-value">${d.area}</span></div>
      <div class="popup-row"><span class="popup-label">Region</span><span class="popup-value">${d.reg}</span></div>
      <div class="popup-row"><span class="popup-label">Stasiun Pusat</span><span class="popup-value">${d.stasiun_pusat}</span></div>
      <div class="popup-row"><span class="popup-label">Domain</span><span class="popup-value">${d.domain}</span></div>
      ${coordRow}
      <a class="gmaps-btn" href="${gmaps}" target="_blank">📍 Buka di Google Maps</a>
      <div class="popup-final-note">✓ Titik final — sudah pasti akan diajukan izin ke DJKA</div>
    </div>
  </div>`;
}

// ── CROSSING CLUSTERS ──
const crossingClusters = {}, crossingItems = {};
wilayahList.forEach(w => {
  crossingClusters[w] = L.markerClusterGroup({
    maxClusterRadius: 40,
    iconCreateFunction: cluster => {
      const color = getColor(w);
      return L.divIcon({
        html: `<div style="background:${color};color:white;border-radius:50%;width:34px;height:34px;
                     display:flex;align-items:center;justify-content:center;font-weight:700;
                     font-size:11px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.3)">
                 ${cluster.getChildCount()}
               </div>`,
        className:'', iconSize:[34,34], iconAnchor:[17,17]
      });
    }
  });
  crossingItems[w] = [];
});

CROSSING_DATA.forEach(d => {
  const marker = L.marker([d.lat, d.lon], { icon: makeCrossingIcon(getColor(d.wilayah)) });
  marker.bindPopup(() => buildPopup(d,'crossing'), { className:'custom-popup', maxWidth:320 });
  crossingItems[d.wilayah].push({ marker, data: d });
});
wilayahList.forEach(w => crossingClusters[w].addTo(map));

// ── SEJAJAR LAYERS: dashed polyline + endpoint circles ──
const sejajarGroups = {}, sejajarItems = {};
wilayahList.forEach(w => { sejajarGroups[w] = L.layerGroup(); sejajarItems[w] = []; });

SEJAJAR_DATA.forEach(d => {
  const color = getColor(d.wilayah);
  const popupOpts = { className:'custom-popup', maxWidth:320 };

  const line = L.polyline([[d.lat1,d.lon1],[d.lat2,d.lon2]], {
    color, weight: 4, opacity: 0.9, dashArray: '8, 5'
  });
  line.bindPopup(() => buildPopup(d,'sejajar'), popupOpts);

  const circleOpts = { radius:6, color:'white', weight:2, fillColor:color, fillOpacity:1 };
  const c1 = L.circleMarker([d.lat1,d.lon1], circleOpts).bindPopup(() => buildPopup(d,'sejajar'), popupOpts);
  const c2 = L.circleMarker([d.lat2,d.lon2], circleOpts).bindPopup(() => buildPopup(d,'sejajar'), popupOpts);

  sejajarItems[d.wilayah].push({ line, c1, c2, data: d });
});
wilayahList.forEach(w => sejajarGroups[w].addTo(map));

// ── FILTER BUTTONS ──
const filterDiv = document.getElementById('filter-btns');
wilayahList.forEach(w => {
  const color = getColor(w);
  const cCount = (crossingItems[w]||[]).length;
  const sCount = (sejajarItems[w]||[]).length;
  const btn = document.createElement('button');
  btn.className = 'filter-btn active';
  btn.id = 'fb-' + w.replace(/ /g,'_');
  btn.style.cssText = `border-color:${color};background:${color};color:white`;
  btn.textContent = `${w} (${cCount}/${sCount})`;
  btn.title = `Crossing: ${cCount} · Sejajar: ${sCount}`;
  btn.onclick = () => toggleWilayah(w);
  filterDiv.appendChild(btn);
});

function passesFilters(d) {
  return true;
}

function populateGroups() {
  wilayahList.forEach(w => {
    crossingClusters[w].clearLayers();
    crossingItems[w].forEach(item => {
      if (passesFilters(item.data)) crossingClusters[w].addLayer(item.marker);
    });
    sejajarGroups[w].clearLayers();
    sejajarItems[w].forEach(item => {
      if (passesFilters(item.data)) {
        sejajarGroups[w].addLayer(item.line);
        sejajarGroups[w].addLayer(item.c1);
        sejajarGroups[w].addLayer(item.c2);
      }
    });
  });
  updateCount();
}
populateGroups();

// ── TOGGLE TYPE ──
function toggleType(tipe) {
  if (tipe === 'crossing') {
    showCrossing = !showCrossing;
    const btn = document.getElementById('type-crossing');
    btn.classList.toggle('active', showCrossing);
    btn.classList.toggle('inactive', !showCrossing);
    wilayahList.forEach(w => {
      if (!activeWilayah[w]) return;
      showCrossing ? map.addLayer(crossingClusters[w]) : map.removeLayer(crossingClusters[w]);
    });
  } else {
    showSejajar = !showSejajar;
    const btn = document.getElementById('type-sejajar');
    btn.classList.toggle('active', showSejajar);
    btn.classList.toggle('inactive', !showSejajar);
    wilayahList.forEach(w => {
      if (!activeWilayah[w]) return;
      showSejajar ? map.addLayer(sejajarGroups[w]) : map.removeLayer(sejajarGroups[w]);
    });
  }
  updateCount();
}

// ── TOGGLE WILAYAH ──
function toggleWilayah(w) {
  activeWilayah[w] = !activeWilayah[w];
  const btn = document.getElementById('fb-' + w.replace(/ /g,'_'));
  const color = getColor(w);
  if (activeWilayah[w]) {
    btn.classList.remove('inactive'); btn.classList.add('active');
    btn.style.cssText = `border-color:${color};background:${color};color:white`;
    if (showCrossing) map.addLayer(crossingClusters[w]);
    if (showSejajar)  map.addLayer(sejajarGroups[w]);
  } else {
    btn.classList.remove('active'); btn.classList.add('inactive');
    btn.style.cssText = `border-color:${color};background:white;color:${color}`;
    map.removeLayer(crossingClusters[w]);
    map.removeLayer(sejajarGroups[w]);
  }
  updateCount();
}

// ── TOGGLE ALL ──
function toggleAll() {
  const allOn = wilayahList.every(w => activeWilayah[w]);
  wilayahList.forEach(w => {
    activeWilayah[w] = !allOn;
    const btn = document.getElementById('fb-' + w.replace(/ /g,'_'));
    const color = getColor(w);
    if (!allOn) {
      btn.classList.remove('inactive'); btn.classList.add('active');
      btn.style.cssText = `border-color:${color};background:${color};color:white`;
      if (showCrossing) map.addLayer(crossingClusters[w]);
      if (showSejajar)  map.addLayer(sejajarGroups[w]);
    } else {
      btn.classList.remove('active'); btn.classList.add('inactive');
      btn.style.cssText = `border-color:${color};background:white;color:${color}`;
      map.removeLayer(crossingClusters[w]);
      map.removeLayer(sejajarGroups[w]);
    }
  });
  document.getElementById('btn-all').textContent = allOn ? 'Semua ON' : 'Semua OFF';
  updateCount();
}

// ── COUNT ──
function updateCount() {
  let c = 0, s = 0;
  wilayahList.forEach(w => {
    if (!activeWilayah[w]) return;
    if (showCrossing) c += crossingItems[w].filter(item => passesFilters(item.data)).length;
    if (showSejajar)  s += sejajarItems[w].filter(item => passesFilters(item.data)).length;
  });
  const parts = [];
  if (showCrossing) parts.push(c + ' crossing');
  if (showSejajar)  parts.push(s + ' sejajar');
  document.getElementById('count-badge').textContent = parts.join(' · ');
}

// ── SEARCH ──
let _searchLayer = null, _searchTimeout;
function popupText(layer) {
  const c = layer._popup && layer._popup._content;
  return (typeof c === 'function' ? c() : (c || '')).toLowerCase();
}
// Pencarian cocok PERSIS (bukan "mengandung") dgn No (Acc) — supaya ketik "47" tidak ikut
// menampilkan "147"/"470" dsb. Berjalan otomatis (debounce 300ms) sambil mengetik, ATAU
// langsung seketika kalau menekan Enter (lihat doSearchNow).
function runSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) {
    if (_searchLayer) { map.removeLayer(_searchLayer); _searchLayer = null; }
    wilayahList.forEach(w => {
      if (!activeWilayah[w]) return;
      if (showCrossing) map.addLayer(crossingClusters[w]);
      if (showSejajar)  map.addLayer(sejajarGroups[w]);
    });
    updateCount();
    return;
  }
  wilayahList.forEach(w => {
    map.removeLayer(crossingClusters[w]);
    map.removeLayer(sejajarGroups[w]);
  });
  if (_searchLayer) { map.removeLayer(_searchLayer); _searchLayer = null; }

  const matched = [];
  if (showCrossing) {
    wilayahList.filter(w => activeWilayah[w]).forEach(w => {
      crossingItems[w].forEach(item => {
        if (passesFilters(item.data) && String(item.data.no).toLowerCase() === q) matched.push(item.marker);
      });
    });
  }
  if (showSejajar) {
    wilayahList.filter(w => activeWilayah[w]).forEach(w => {
      sejajarItems[w].forEach(item => {
        if (passesFilters(item.data) && String(item.data.no).toLowerCase() === q) matched.push(item.line);
      });
    });
  }

  _searchLayer = L.layerGroup(matched).addTo(map);
  document.getElementById('count-badge').textContent = matched.length + ' hasil pencarian';

  if (matched.length === 1) {
    const lyr = matched[0];
    if (lyr.getLatLng) { map.setView(lyr.getLatLng(), 15); lyr.openPopup(); }
    else if (lyr.getBounds) { map.fitBounds(lyr.getBounds().pad(0.3)); lyr.openPopup(); }
  } else if (matched.length > 1) {
    map.fitBounds(L.featureGroup(matched).getBounds().pad(0.1));
  }
}
function doSearch(q) {
  clearTimeout(_searchTimeout);
  _searchTimeout = setTimeout(() => runSearch(q), 300);
}
function doSearchNow(q) {
  clearTimeout(_searchTimeout);
  runSearch(q);
}

</script>

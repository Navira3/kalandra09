<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }

#header {
  background: #1a2744;
  color: white;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  transition: background 0.25s;
}
#header.mode-final { background: #065f46; }
#header.mode-not { background: #9a3412; }
#header h1 { font-size: 15px; font-weight: 600; flex: 1; min-width: 200px; }
#search-box {
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  width: 220px;
  outline: none;
}
#count-badge {
  background: #3b82f6;
  color: white;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
#header.mode-final #count-badge { background: #16a34a; }
#header.mode-not #count-badge { background: #ea580c; }

/* Mode switch */
#mode-switch {
  display: flex;
  background: rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  padding: 6px 14px;
  border-radius: 17px;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.75);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.mode-btn.active {
  background: white;
  color: #1a2744;
}
#header.mode-final .mode-btn.active { color: #065f46; }
#header.mode-not .mode-btn.active { color: #9a3412; }

#mode-banner {
  padding: 5px 16px;
  font-size: 11.5px;
  font-weight: 600;
  color: #1e3a8a;
  background: #dbeafe;
  border-bottom: 1px solid #bfdbfe;
}
#mode-banner.final {
  color: #065f46;
  background: #d1fae5;
  border-bottom: 1px solid #a7f3d0;
}
#mode-banner.not {
  color: #9a3412;
  background: #ffedd5;
  border-bottom: 1px solid #fed7aa;
}

#controls {
  background: #f1f5f9;
  padding: 6px 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  border-bottom: 1px solid #e2e8f0;
}
.ctrl-label { font-size: 11px; color: #64748b; font-weight: 700; white-space: nowrap; }
.ctrl-sep { width: 1px; background: #cbd5e1; height: 20px; margin: 0 4px; }

/* Legend strip */
#legend-strip {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #fff;
  padding: 4px 16px;
  border-bottom: 1px solid #e2e8f0;
  font-size: 11px;
  color: #334155;
  flex-wrap: wrap;
}
.leg-item { display: flex; align-items: center; gap: 5px; }
.leg-pin {
  width: 14px; height: 20px;
  display: inline-flex; align-items: center; justify-content: center;
}

.type-btn {
  padding: 4px 12px;
  border-radius: 20px;
  border: 2px solid;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.type-btn.active  { color: white; }
.type-btn.inactive { background: white !important; opacity: 0.5; }
#type-crossing { border-color: #1a2744; background: #1a2744; color: white; }
#type-sejajar  { border-color: #0891b2; background: #0891b2; color: white; }

.filter-btn {
  padding: 3px 9px;
  border-radius: 20px;
  border: 2px solid;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.filter-btn.active  { color: white; }
.filter-btn.inactive { background: white !important; opacity: 0.45; }

#btn-all {
  background: #334155; color: white;
  border: none; border-radius: 20px;
  padding: 4px 12px; font-size: 11px;
  font-weight: 700; cursor: pointer;
}
#btn-export {
  background: #0d9488; color: white;
  border: none; border-radius: 20px;
  padding: 4px 12px; font-size: 11px;
  font-weight: 700; cursor: pointer;
}
#btn-export:hover { background: #0f766e; }

#map { flex: 1; }

/* Popup */
.custom-popup .leaflet-popup-content-wrapper {
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
  padding: 0; min-width: 270px;
}
.custom-popup .leaflet-popup-content { margin: 0; }
.popup-header {
  padding: 10px 14px 8px; color: white;
  border-radius: 8px 8px 0 0;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.popup-body { padding: 10px 14px 12px; font-size: 12px; }
.popup-row { display: flex; margin-bottom: 4px; }
.popup-label { color: #64748b; width: 130px; flex-shrink: 0; font-size: 11px; }
.popup-value { font-weight: 600; color: #1e293b; }
.popup-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 700; color: white;
  margin-left: auto;
}
.popup-final-note {
  margin-top: 10px; padding: 7px 9px; border-radius: 6px;
  background: #ecfdf5; border: 1px solid #a7f3d0;
  font-size: 10.5px; color: #047857; font-weight: 600;
}
.popup-dup-note {
  margin-bottom: 10px; padding: 7px 9px; border-radius: 6px;
  background: #f3e8ff; border: 1px solid #d8b4fe;
  font-size: 10.5px; color: #6b21a8; font-weight: 600;
}
.popup-line-note {
  margin-bottom: 10px; padding: 7px 9px; border-radius: 6px;
  background: #e0f2fe; border: 1px solid #7dd3fc;
  font-size: 10.5px; color: #075985; font-weight: 600;
}
.popup-not-note {
  margin-top: 10px; padding: 7px 9px; border-radius: 6px;
  background: #ffedd5; border: 1px solid #fed7aa;
  font-size: 10.5px; color: #9a3412; font-weight: 600;
}
.gmaps-btn {
  display: inline-block; margin-top: 8px;
  padding: 5px 12px; background: #10b981;
  color: white; text-decoration: none;
  border-radius: 5px; font-size: 11px; font-weight: 600;
}
.gmaps-btn:hover { background: #059669; }
</style>
</head>

<div id="header">
  <h1>🛰️ Peta Fiber Optik PT IFT – Jalur KAI</h1>
  <div id="mode-switch">
    <button class="mode-btn active" id="mode-btn-awal" onclick="switchMode('awal')">Semua Data</button>
    <button class="mode-btn" id="mode-btn-final" onclick="switchMode('final')">✓ OK Verif</button>
    <button class="mode-btn" id="mode-btn-not" onclick="switchMode('not')">✗ Not Verif</button>

  <button class="type-btn active" id="type-crossing" onclick="toggleType('crossing')">⊕ Crossing</button>

  <div class="ctrl-sep"></div>

  <button id="btn-all" onclick="toggleAll()">Semua ON</button>
  <div id="filter-btns"></div>
  <div class="ctrl-sep"></div>
  <button id="btn-export" onclick="exportAllCSV()">⬇ Export Semua Data (CSV)</button>

};
function getColor(w) { return COLORS[w] || '#888'; }

// ── MAP ──
const map = L.map('map').setView([-6.9, 108.5], 7);
// Beberapa sumber tile OSM dicoba berurutan; kalau satu sumber banyak gagal (limit/down),
// otomatis pindah ke sumber berikutnya tanpa perlu edit ulang file ini.
const TILE_PROVIDERS = [
  { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attribution: '&copy; OpenStreetMap contributors' },
  { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attribution: 'Tiles &copy; Esri' }
];
let _tileLayer = null, _tileErrCount = 0;
function loadTileProvider(idx) {
  if (_tileLayer) map.removeLayer(_tileLayer);
  const p = TILE_PROVIDERS[idx];
  _tileErrCount = 0;
  _tileLayer = L.tileLayer(p.url, { attribution: p.attribution, maxZoom: 19 });
  _tileLayer.on('tileerror', () => {
    _tileErrCount++;
    if (_tileErrCount > 8 && idx < TILE_PROVIDERS.length - 1) loadTileProvider(idx + 1);
  });
  _tileLayer.addTo(map);
}
loadTileProvider(0);

// ── ICON crossing sederhana (tanpa status); titik "duplikat" (Crossing+Sejajar) dapat badge ungu "D" ──
function makeCrossingIcon(color, isDuplikat) {
  const badge = isDuplikat
    ? `<circle cx="19" cy="6" r="6.2" fill="#7c3aed" stroke="white" stroke-width="1.6"/><text x="19" y="8.7" font-size="7.5" text-anchor="middle" fill="white" font-weight="bold">D</text>`
    : '';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 36" width="22" height="30">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 8.4 12 24 12 24S24 20.4 24 12C24 5.4 18.6 0 12 0z"
          fill="${color}" stroke="white" stroke-width="1.8"/>
    <line x1="12" y1="6.5" x2="12" y2="17.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6.5" y1="12" x2="17.5" y2="12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    ${badge}
  </svg>`;
  return L.divIcon({ html: svg, className:'', iconSize:[22,30], iconAnchor:[10,30], popupAnchor:[0,-30] });
}

// ── POPUP ──
function buildPopup(d, tipe) {
  const color = getColor(d.wilayah);
  const badgeIcon = tipe === 'crossing' ? '⊕' : '〰';
  const badgeLabel = tipe === 'crossing' ? 'CROSSING' : 'SEJAJAR';
  const isLineCrossing = tipe === 'crossing' && d.lat2 != null && d.lon2 != null;
  const gmaps = tipe === 'sejajar'
    ? `https://www.google.com/maps/dir/${d.lat1},${d.lon1}/${d.lat2},${d.lon2}`
    : isLineCrossing
      ? `https://www.google.com/maps/dir/${d.lat},${d.lon}/${d.lat2},${d.lon2}`
      : `https://www.google.com/maps?q=${d.lat},${d.lon}`;
  const coordRow = tipe === 'sejajar'
    ? `<div class="popup-row"><span class="popup-label">Koord. Awal</span><span class="popup-value">${d.lat1}, ${d.lon1}</span></div>
       <div class="popup-row"><span class="popup-label">Koord. Akhir</span><span class="popup-value">${d.lat2}, ${d.lon2}</span></div>`
    : isLineCrossing
      ? `<div class="popup-row"><span class="popup-label">Koord. Awal</span><span class="popup-value">${d.lat}, ${d.lon}</span></div>
         <div class="popup-row"><span class="popup-label">Koord. Akhir</span><span class="popup-value">${d.lat2}, ${d.lon2}</span></div>`
      : `<div class="popup-row"><span class="popup-label">Koordinat</span><span class="popup-value">${d.lat}, ${d.lon}</span></div>`;
  const finalNote = mode === 'final'
    ? `<div class="popup-final-note">✓ Titik final — sudah pasti akan diajukan izin ke DJKA</div>` : '';
  const notNote = mode === 'not'
    ? `<div class="popup-not-note">✗ Titik ini belum masuk data final/terverifikasi (Not Verif)</div>` : '';
  const dupNote = d._duplikat
    ? `<div class="popup-dup-note">⚠ Titik duplikat — lokasi ini tercatat sebagai Crossing DAN Sejajar sekaligus</div>` : '';
  const lineNote = isLineCrossing
    ? `<div class="popup-line-note">↔ Titik crossing ini mencakup rentang KM, ditampilkan sebagai garis di peta (koordinat awal &amp; akhir)</div>` : '';

  return `<div>
    <div class="popup-header" style="background:${color}">
      <span>No ${d.no}${d.no_urut ? ' (urut '+d.no_urut+')' : ''} | ${d.wilayah}</span>
      <span class="popup-badge" style="background:rgba(0,0,0,0.25)">${badgeIcon} ${badgeLabel}</span>
    </div>
    <div class="popup-body">
      ${dupNote}
      ${lineNote}
      <div class="popup-row"><span class="popup-label">No BA</span><span class="popup-value">${d.no_ba}</span></div>
      <div class="popup-row"><span class="popup-label">KM+HM</span><span class="popup-value">${d.km}</span></div>
      <div class="popup-row"><span class="popup-label">Stasiun-Antara</span><span class="popup-value">${d.stasiun}</span></div>
      <div class="popup-row"><span class="popup-label">Lintas</span><span class="popup-value">${d.lintas}</span></div>
      <div class="popup-row"><span class="popup-label">Area</span><span class="popup-value">${d.area}</span></div>
      <div class="popup-row"><span class="popup-label">Region</span><span class="popup-value">${d.reg}</span></div>
      <div class="popup-row"><span class="popup-label">Stasiun Pusat</span><span class="popup-value">${d.stasiun_pusat}</span></div>
      <div class="popup-row"><span class="popup-label">Domain</span><span class="popup-value">${d.domain}</span></div>
      ${coordRow}
      <a class="gmaps-btn" href="${gmaps}" target="_blank">📍 Buka di Google Maps</a>
      ${finalNote}
      ${notNote}
    </div>
  </div>`;
}

// ── STATE PER MODE (dibangun sekali di awal untuk 'awal' & 'final', supaya toggle langsung cepat) ──
const modeState = {}; // mode -> { wilayahList, activeWilayah, crossingClusters, crossingItems, sejajarGroups, sejajarItems }
let mode = 'awal';
let showCrossing = true, showSejajar = true;

function buildModeState(m) {
  const CROSSING_DATA = DATASETS[m].crossing;
  const SEJAJAR_DATA  = DATASETS[m].sejajar;

  const wilayahList = [...new Set([
    ...CROSSING_DATA.map(d => d.wilayah),
    ...SEJAJAR_DATA.map(d => d.wilayah)
  ])].sort();

  const activeWilayah = {};
  wilayahList.forEach(w => activeWilayah[w] = true);

  const crossingClusters = {}, crossingItems = {}, crossingLineGroups = {}, crossingLineItems = {};
  wilayahList.forEach(w => {
    crossingClusters[w] = L.markerClusterGroup({
      maxClusterRadius: 40,
      iconCreateFunction: cluster => {
        const color = getColor(w);
        return L.divIcon({
          html: `<div style="background:${color};color:white;border-radius:50%;width:34px;height:34px;
                       display:flex;align-items:center;justify-content:center;font-weight:700;
                       font-size:11px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.3)">
                   ${cluster.getChildCount()}
                 </div>`,
          className:'', iconSize:[34,34], iconAnchor:[17,17]
        });
      }
    });
    crossingItems[w] = [];
    crossingLineGroups[w] = L.layerGroup();
    crossingLineItems[w] = [];
  });
  CROSSING_DATA.forEach(d => {
    const marker = L.marker([d.lat, d.lon], { icon: makeCrossingIcon(getColor(d.wilayah), !!d._duplikat) });
    marker.bindPopup(() => buildPopup(d,'crossing'), { className:'custom-popup', maxWidth:320 });
    crossingItems[d.wilayah].push({ marker, data: d });

    if (d.lat2 != null && d.lon2 != null) {
      const lineColor = getColor(d.wilayah);
      const segLine = L.polyline([[d.lat, d.lon],[d.lat2, d.lon2]], {
        color: lineColor, weight: 4, opacity: 0.9, dashArray: '8, 5'
      });
      const endMarker = L.marker([d.lat2, d.lon2], { icon: makeCrossingIcon(lineColor, !!d._duplikat) });
      segLine.bindPopup(() => buildPopup(d,'crossing'), { className:'custom-popup', maxWidth:320 });
      endMarker.bindPopup(() => buildPopup(d,'crossing'), { className:'custom-popup', maxWidth:320 });
      crossingLineItems[d.wilayah].push({ segLine, endMarker, data: d });
    }
  });

  const sejajarGroups = {}, sejajarItems = {};
  wilayahList.forEach(w => { sejajarGroups[w] = L.layerGroup(); sejajarItems[w] = []; });
  SEJAJAR_DATA.forEach(d => {
    const color = getColor(d.wilayah);
    const popupOpts = { className:'custom-popup', maxWidth:320 };
    const isDup = !!d._duplikat;
    const line = L.polyline([[d.lat1,d.lon1],[d.lat2,d.lon2]], { color, weight: isDup ? 3 : 4, opacity: 0.9, dashArray: isDup ? '2, 5' : '8, 5' });
    line.bindPopup(() => buildPopup(d,'sejajar'), popupOpts);
    const circleOpts = { radius:6, color: isDup ? '#7c3aed' : 'white', weight: isDup ? 3 : 2, fillColor:color, fillOpacity:1 };
    const c1 = L.circleMarker([d.lat1,d.lon1], circleOpts).bindPopup(() => buildPopup(d,'sejajar'), popupOpts);
    const c2 = L.circleMarker([d.lat2,d.lon2], circleOpts).bindPopup(() => buildPopup(d,'sejajar'), popupOpts);
    sejajarItems[d.wilayah].push({ line, c1, c2, data: d });
  });

  return { wilayahList, activeWilayah, crossingClusters, crossingItems, crossingLineGroups, crossingLineItems, sejajarGroups, sejajarItems };
}

modeState.awal  = buildModeState('awal');
modeState.final = buildModeState('final');
modeState.not   = buildModeState('not');

function passesFilters(d) {
  return true;
}

// Render tampilan awal (mode = 'awal') begitu halaman dimuat -- tanpa ini peta
// akan kosong sampai tombol mode diklik sekali.
window.addEventListener('DOMContentLoaded', function() {
  buildFilterButtons();
  populateGroups();
  addModeLayersToMap();
});

function buildFilterButtons() {
  const st = modeState[mode];
  const filterDiv = document.getElementById('filter-btns');
  filterDiv.innerHTML = '';
  st.wilayahList.forEach(w => {
    const color = getColor(w);
    const cCount = (st.crossingItems[w]||[]).length;
    const sCount = (st.sejajarItems[w]||[]).length;
    const btn = document.createElement('button');
    btn.className = 'filter-btn active';
    btn.id = 'fb-' + w.replace(/ /g,'_');
    btn.style.cssText = `border-color:${color};background:${color};color:white`;
    btn.textContent = `${w} (${cCount}/${sCount})`;
    btn.title = `Crossing: ${cCount} · Sejajar: ${sCount}`;
    btn.onclick = () => toggleWilayah(w);
    filterDiv.appendChild(btn);
  });
  document.getElementById('btn-all').textContent = 'Semua ON';
}

function populateGroups() {
  const st = modeState[mode];
  st.wilayahList.forEach(w => {
    st.crossingClusters[w].clearLayers();
    st.crossingItems[w].forEach(item => { if (passesFilters(item.data)) st.crossingClusters[w].addLayer(item.marker); });
    st.crossingLineGroups[w].clearLayers();
    st.crossingLineItems[w].forEach(item => {
      if (passesFilters(item.data)) {
        st.crossingLineGroups[w].addLayer(item.segLine);
        st.crossingLineGroups[w].addLayer(item.endMarker);
      }
    });
    st.sejajarGroups[w].clearLayers();
    st.sejajarItems[w].forEach(item => {
      if (passesFilters(item.data)) {
        st.sejajarGroups[w].addLayer(item.line);
        st.sejajarGroups[w].addLayer(item.c1);
        st.sejajarGroups[w].addLayer(item.c2);
      }
    });
  });
  updateCount();
}

function addModeLayersToMap() {
  const st = modeState[mode];
  st.wilayahList.forEach(w => {
    if (!st.activeWilayah[w]) return;
    if (showCrossing) map.addLayer(st.crossingClusters[w]);
    if (showCrossing) map.addLayer(st.crossingLineGroups[w]);
    if (showSejajar)  map.addLayer(st.sejajarGroups[w]);
  });
}
function removeModeLayersFromMap(m) {
  const st = modeState[m];
  st.wilayahList.forEach(w => {
    map.removeLayer(st.crossingClusters[w]);
    map.removeLayer(st.crossingLineGroups[w]);
    map.removeLayer(st.sejajarGroups[w]);
  });
}

// ── GANTI MODE (Awal <-> Final) ──
function switchMode(newMode) {
  if (newMode === mode) return;
  if (_searchLayer) { map.removeLayer(_searchLayer); _searchLayer = null; document.getElementById('search-box').value=''; }
  removeModeLayersFromMap(mode);
  mode = newMode;

  document.getElementById('mode-btn-awal').classList.toggle('active', mode === 'awal');
  document.getElementById('mode-btn-final').classList.toggle('active', mode === 'final');
  document.getElementById('mode-btn-not').classList.toggle('active', mode === 'not');
  document.getElementById('header').classList.toggle('mode-final', mode === 'final');
  document.getElementById('header').classList.toggle('mode-not', mode === 'not');
  const banner = document.getElementById('mode-banner');
  banner.classList.remove('final', 'not');
  if (mode === 'final') {
    banner.textContent = '✓ Menampilkan HANYA titik yang sudah OK Verif / dipastikan akan diajukan izin ke DJKA.';
    banner.classList.add('final');
  } else if (mode === 'not') {
    banner.textContent = '✗ Menampilkan HANYA titik yang BELUM masuk data final/terverifikasi (Not Verif) — data tetap tersimpan, hanya belum masuk daftar OK Verif.';
    banner.classList.add('not');
  } else {
    banner.textContent = 'Menampilkan SELURUH data titik FO yang terkumpul (belum difilter status perizinan).';
  }

  buildFilterButtons();
  populateGroups();
  addModeLayersToMap();
}

// ── TOGGLE TYPE ──
function toggleType(tipe) {
  const st = modeState[mode];
  if (tipe === 'crossing') {
    showCrossing = !showCrossing;
    const btn = document.getElementById('type-crossing');
    btn.classList.toggle('active', showCrossing);
    btn.classList.toggle('inactive', !showCrossing);
    st.wilayahList.forEach(w => {
      if (!st.activeWilayah[w]) return;
      showCrossing ? map.addLayer(st.crossingClusters[w]) : map.removeLayer(st.crossingClusters[w]);
      showCrossing ? map.addLayer(st.crossingLineGroups[w]) : map.removeLayer(st.crossingLineGroups[w]);
    });
  } else {
    showSejajar = !showSejajar;
    const btn = document.getElementById('type-sejajar');
    btn.classList.toggle('active', showSejajar);
    btn.classList.toggle('inactive', !showSejajar);
    st.wilayahList.forEach(w => {
      if (!st.activeWilayah[w]) return;
      showSejajar ? map.addLayer(st.sejajarGroups[w]) : map.removeLayer(st.sejajarGroups[w]);
    });
  }
  updateCount();
}

// ── TOGGLE WILAYAH ──
function toggleWilayah(w) {
  const st = modeState[mode];
  st.activeWilayah[w] = !st.activeWilayah[w];
  const btn = document.getElementById('fb-' + w.replace(/ /g,'_'));
  const color = getColor(w);
  if (st.activeWilayah[w]) {
    btn.classList.remove('inactive'); btn.classList.add('active');
    btn.style.cssText = `border-color:${color};background:${color};color:white`;
    if (showCrossing) map.addLayer(st.crossingClusters[w]);
    if (showCrossing) map.addLayer(st.crossingLineGroups[w]);
    if (showSejajar)  map.addLayer(st.sejajarGroups[w]);
  } else {
    btn.classList.remove('active'); btn.classList.add('inactive');
    btn.style.cssText = `border-color:${color};background:white;color:${color}`;
    map.removeLayer(st.crossingClusters[w]);
    map.removeLayer(st.crossingLineGroups[w]);
    map.removeLayer(st.sejajarGroups[w]);
  }
  updateCount();
}

// ── TOGGLE ALL ──
function toggleAll() {
  const st = modeState[mode];
  const allOn = st.wilayahList.every(w => st.activeWilayah[w]);
  st.wilayahList.forEach(w => {
    st.activeWilayah[w] = !allOn;
    const btn = document.getElementById('fb-' + w.replace(/ /g,'_'));
    const color = getColor(w);
    if (!allOn) {
      btn.classList.remove('inactive'); btn.classList.add('active');
      btn.style.cssText = `border-color:${color};background:${color};color:white`;
      if (showCrossing) map.addLayer(st.crossingClusters[w]);
      if (showCrossing) map.addLayer(st.crossingLineGroups[w]);
      if (showSejajar)  map.addLayer(st.sejajarGroups[w]);
    } else {
      btn.classList.remove('active'); btn.classList.add('inactive');
      btn.style.cssText = `border-color:${color};background:white;color:${color}`;
      map.removeLayer(st.crossingClusters[w]);
      map.removeLayer(st.crossingLineGroups[w]);
      map.removeLayer(st.sejajarGroups[w]);
    }
  });
  document.getElementById('btn-all').textContent = allOn ? 'Semua ON' : 'Semua OFF';
  updateCount();
}

// ── COUNT ──
function updateCount() {
  const st = modeState[mode];
  let c = 0, s = 0;
  st.wilayahList.forEach(w => {
    if (!st.activeWilayah[w]) return;
    if (showCrossing) c += st.crossingItems[w].filter(item => passesFilters(item.data)).length;
    if (showSejajar)  s += st.sejajarItems[w].filter(item => passesFilters(item.data)).length;
  });
  const parts = [];
  if (showCrossing) parts.push(c + ' crossing');
  if (showSejajar)  parts.push(s + ' sejajar');
  document.getElementById('count-badge').textContent = parts.join(' · ');
}

// ── SEARCH ──
let _searchLayer = null, _searchTimeout;
function popupText(layer) {
  const c = layer._popup && layer._popup._content;
  return (typeof c === 'function' ? c() : (c || '')).toLowerCase();
}
// Pencarian cocok PERSIS (bukan "mengandung") dgn No (Acc) — supaya ketik "47" tidak ikut
// menampilkan "147"/"470" dsb. Berjalan otomatis (debounce 300ms) sambil mengetik, ATAU
// langsung seketika kalau menekan Enter (lihat doSearchNow).
function runSearch(q) {
  const st = modeState[mode];
  q = q.trim().toLowerCase();
  if (!q) {
    if (_searchLayer) { map.removeLayer(_searchLayer); _searchLayer = null; }
    st.wilayahList.forEach(w => {
      if (!st.activeWilayah[w]) return;
      if (showCrossing) map.addLayer(st.crossingClusters[w]);
      if (showCrossing) map.addLayer(st.crossingLineGroups[w]);
      if (showSejajar)  map.addLayer(st.sejajarGroups[w]);
    });
    updateCount();
    return;
  }
  st.wilayahList.forEach(w => {
    map.removeLayer(st.crossingClusters[w]);
    map.removeLayer(st.crossingLineGroups[w]);
    map.removeLayer(st.sejajarGroups[w]);
  });
  if (_searchLayer) { map.removeLayer(_searchLayer); _searchLayer = null; }

  const matched = [];
  if (showCrossing) {
    st.wilayahList.filter(w => st.activeWilayah[w]).forEach(w => {
      st.crossingItems[w].forEach(item => {
        if (passesFilters(item.data) && String(item.data.no).toLowerCase() === q) matched.push(item.marker);
      });
    });
  }
  if (showSejajar) {
    st.wilayahList.filter(w => st.activeWilayah[w]).forEach(w => {
      st.sejajarItems[w].forEach(item => {
        if (passesFilters(item.data) && String(item.data.no).toLowerCase() === q) matched.push(item.line);
      });
    });
  }

  _searchLayer = L.layerGroup(matched).addTo(map);
  document.getElementById('count-badge').textContent = matched.length + ' hasil pencarian';

  if (matched.length === 1) {
    const lyr = matched[0];
    if (lyr.getLatLng) { map.setView(lyr.getLatLng(), 15); lyr.openPopup(); }
    else if (lyr.getBounds) { map.fitBounds(lyr.getBounds().pad(0.3)); lyr.openPopup(); }
  } else if (matched.length > 1) {
    map.fitBounds(L.featureGroup(matched).getBounds().pad(0.1));
  }
}
function doSearch(q) {
  clearTimeout(_searchTimeout);
  _searchTimeout = setTimeout(() => runSearch(q), 300);
}
function doSearchNow(q) {
  clearTimeout(_searchTimeout);
  runSearch(q);
}

// ── EXPORT SEMUA DATA (1 tombol, 1 file CSV, berisi Crossing+Sejajar & OK+Not Verif sekaligus) ──
function csvEscape(v) {
  if (v === null || v === undefined) v = '';
  v = String(v);
  if (/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function todayStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
}

// Titik dianggap "OK Verif" kalau id-nya ada di data final (confirmed); selain itu "Not Verif".
const _OK_CROSSING_IDS = new Set(DATASETS.final.crossing.map(d => d.id));
const _OK_SEJAJAR_IDS  = new Set(DATASETS.final.sejajar.map(d => d.id));

function exportAllCSV() {
  const headers = [
    'Tipe', 'Status', 'No (Acc)', 'No Urut', 'No BA', 'Wilayah', 'KM+HM', 'Stasiun Antara',
    'Lintas', 'Area', 'Region', 'Stasiun Pusat', 'Domain',
    'Latitude', 'Longitude', 'Latitude 2', 'Longitude 2'
  ];
  const rows = [headers];

  DATASETS.awal.crossing.forEach(d => {
    const status = _OK_CROSSING_IDS.has(d.id) ? 'OK Verif' : 'Not Verif';
    rows.push([
      'Crossing', status, d.no, d.no_urut, d.no_ba, d.wilayah, d.km, d.stasiun,
      d.lintas, d.area, d.reg, d.stasiun_pusat, d.domain,
      d.lat, d.lon, d.lat2 != null ? d.lat2 : '', d.lon2 != null ? d.lon2 : ''
    ]);
  });
  DATASETS.awal.sejajar.forEach(d => {
    const status = _OK_SEJAJAR_IDS.has(d.id) ? 'OK Verif' : 'Not Verif';
    rows.push([
      'Sejajar', status, d.no, d.no_urut, d.no_ba, d.wilayah, d.km, d.stasiun,
      d.lintas, d.area, d.reg, d.stasiun_pusat, d.domain,
      d.lat1, d.lon1, d.lat2, d.lon2
    ]);
  });

  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  downloadBlob('\uFEFF' + csv, `Data_FO_Semua_${todayStr()}.csv`, 'text/csv;charset=utf-8;');
}
